name: Deploy demo web (GitHub Pages)

on:
  push:
    branches:
      - cursor/midnight-demo-web-409a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo-web/package-lock.json
      - run: npm install
      - run: npm install
        working-directory: demo-web
      - run: VITE_BASE=/refacton_midnight/ npm run build
        working-directory: demo-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
